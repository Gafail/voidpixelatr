# Common security headers for Void* sites.
#
# This is the shared snippet, vendored into this repository so the project
# stands on its own: the CSP test server and the deploy script both need it,
# and neither should depend on a sibling checkout being present.
#
# When this project is deployed alongside the rest of the family, the umbrella
# copy at `ops/nginx-snippets/security-headers.conf` is the one that gets
# installed, and a node test checks that the two agree — this file cannot
# drift away from what nginx will actually send.

# Usage inside a server { } block:
#   include snippets/security-headers.conf;
# Or copy and customize per-site.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP: GENERIC TEMPLATE. Replace domains below with what your site actually loads.
# Default-src 'self' restricts everything to the same origin.
# img-src 'self' data: https: allows inline data URIs and any https image.
# media-src 'self' https: allows https media (YouTube iframes need this).
# script-src 'self' + your script sources. Add cdn.example.com for any CDNs.
# style-src 'self' 'unsafe-inline' allows inline styles (most frameworks need this).
# frame-src + your iframe sources (YouTube, Cloudflare Turnstile, etc.).
# connect-src + your XHR/fetch sources.
# font-src 'self' data: allows local and inline fonts.

add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src; connect-src 'self'; font-src 'self' data:" always;

# Note: CSP may be stripped by Cloudflare at the edge. If your CSP isn't
# reaching the browser, set it via Cloudflare Transform Rules (Modify Response
# Header action).
