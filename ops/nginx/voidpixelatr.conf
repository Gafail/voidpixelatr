# VoidPixelatr — the photo-to-pixel-art pipeline.
#
# This container would serve exactly one site, so this server block is the
# only one: it is the default server and answers every request on port 80.
# Nothing is proxied, nothing is shared — the site is static files in a
# directory, served straight off disk by nginx.
#
# LAN only: there is no domain and no tunnel. The address is reserved in the
# router by the container's MAC, so it never moves.
#
# There is no container for this project yet. The vhost and the deploy
# script are here so the project is standalone and can be given its own box
# when it wants one; nothing has been installed and nothing has been
# deployed.
#
# The shared security-headers snippet applies unmodified. That is why the
# app is split into index.html + css/ + js/ rather than being one file: the
# CSP is `script-src 'self'`, so an inline <script> would be blocked.
#
# The address below is a PLACEHOLDER: 192.0.2.0 is the RFC 5737
# documentation range, so it can never collide with a real machine on the
# LAN — a checked-in config that named a live address once blew away
# whatever was answering on it. deploy.sh substitutes the reserved address
# for this token when it installs the file. Leave the placeholder in place.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 192.0.2.0 voidpixelatr voidpixelatr.local _;

    root /var/www/voidpixelatr;
    index index.html;

    access_log /var/log/webapps/voidpixelatr.access.log;
    error_log  /var/log/webapps/voidpixelatr.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # Shared Void* headers, unmodified.
    include /etc/nginx/snippets/security-headers.conf;

    # Cache rules.
    #
    # `expires` is used rather than `add_header Cache-Control`: an
    # `add_header` inside a location block discards every `add_header`
    # inherited from the server block, which would silently drop the
    # security headers above on those locations.
    location = /index.html {
        expires 60s;
    }

    location = /404.html {
        internal;
    }

    location ~* \.(css|js)$ {
        expires 60s;
    }

    location ~* \.(svg|png|ico|woff2)$ {
        expires 7d;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
